# Builds the APK and publishes it as a GitHub release you can download on the phone.
name: Build APK

on:
  push:
    branches: [main, "dev/**"]
    paths-ignore: [".github/workflows/tdlib.yml", "README.md"]
  workflow_dispatch:
  workflow_run:
    workflows: [TDLib]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download TDLib
        run: |
          TD_COMMIT=$(grep -m1 'TD_COMMIT:' .github/workflows/tdlib.yml | awk '{print $2}')
          TAG="tdlib-${TD_COMMIT:0:7}"
          if ! gh release download "$TAG" -p tdlib.zip -R "$GITHUB_REPOSITORY"; then
            echo "::error::TDLib $TAG ещё не собран. Дождись workflow TDLib — после него APK соберётся сам."
            exit 1
          fi
          unzip -q tdlib.zip
          mkdir -p app/src/main/jniLibs app/src/main/java
          cp -r tdlib/libs/* app/src/main/jniLibs/
          cp -r tdlib/java/* app/src/main/java/
          find app/src/main/jniLibs -name '*.so' -exec ls -la {} \;

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION="1.0.${{ github.run_number }}"
          APK="TgMusic-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if [ -n "${{ secrets.TG_API_ID }}" ]; then KEYS="встроены"; else KEYS="не встроены — приложение попросит ввести api_id и api_hash"; fi
          gh release create "v$VERSION" "$APK" -R "$GITHUB_REPOSITORY" \
            --title "TgMusic $VERSION" \
            --notes "Скачай $APK на телефон и установи. Ключи Telegram API: $KEYS." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: TgMusic-apk
          path: app/build/outputs/apk/release/*.apk

# Builds TDLib (Telegram library) for Android once and stores it as a release asset.
# The app workflow downloads this asset, so the long native build runs only when TD_COMMIT changes.
name: TDLib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/tdlib.yml"]

env:
  TD_COMMIT: 03220f6b3043c6fd7785fbf0901d63f19ad19974
  ABIS: "arm64-v8a armeabi-v7a"
  MIN_API: "24"

permissions:
  contents: write

concurrency:
  group: tdlib
  cancel-in-progress: false

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check if already built
        id: check
        run: |
          TAG="tdlib-${TD_COMMIT:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "TDLib $TAG already built, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl make zip unzip

      - name: Get TDLib source
        if: steps.check.outputs.exists != 'true'
        run: |
          git init td
          cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth 1 origin "$TD_COMMIT"
          git checkout FETCH_HEAD

      - name: Fetch Android SDK and NDK
        if: steps.check.outputs.exists != 'true'
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: Build OpenSSL
        if: steps.check.outputs.exists != 'true'
        working-directory: td/example/android
        run: ./build-openssl.sh

      - name: Build TDLib
        if: steps.check.outputs.exists != 'true'
        working-directory: td/example/android
        run: ./build-tdlib.sh '' '' '' '' Java "$MIN_API" "$ABIS"

      - name: Publish TDLib
        if: steps.check.outputs.exists != 'true'
        working-directory: td/example/android
        run: |
          ls -la tdlib tdlib/libs/*
          gh release create "${{ steps.check.outputs.tag }}" tdlib/tdlib.zip \
            -R "$GITHUB_REPOSITORY" \
            --title "TDLib ${TD_COMMIT:0:7}" \
            --notes "Prebuilt TDLib (Java interface) for Android: $ABIS. Used by the app build." \
            --prerelease
